// Read-only reference calendar: navigation is independent of the future planner.
let calView=new Date();calView.setDate(1);
function renderCalendar(){const y=calView.getFullYear(),m=calView.getMonth(),today=new Date();document.getElementById('cal-month').textContent=calView.toLocaleDateString('en-US',{month:'long',year:'numeric'});const grid=document.getElementById('cal-grid');grid.replaceChildren();['S','M','T','W','T','F','S'].forEach(d=>{const el=document.createElement('span');el.className='weekday';el.textContent=d;grid.append(el)});const start=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();for(let i=0;i<42;i++){const day=i-start+1,el=document.createElement('span');el.className='day'+(day<1||day>days?' outside':'')+(day===today.getDate()&&m===today.getMonth()&&y===today.getFullYear()?' today':'');el.textContent=day<1?new Date(y,m,day).getDate():day>days?day-days:day;grid.append(el)}}
document.getElementById('cal-prev').addEventListener('click',()=>{calView.setMonth(calView.getMonth()-1);renderCalendar()});document.getElementById('cal-next').addEventListener('click',()=>{calView.setMonth(calView.getMonth()+1);renderCalendar()});renderCalendar();
